# IPS-PROD - Observables 1/2

## Operators

One can introduce operators related to geometrical properties, like

* identity operator: `\(\hat{1}\)`
* position operator (`\(z\)`-axis): `\(\hat{z}\)`
* position operator (`\(r_\perp\)`-axis): `\(\hat{r}_\perp\)`
* quadrupole operator `\(\hat{Q}_{20}\equiv \frac{1}{4}\sqrt{\frac{5}{\pi}}\left(2 \hat{z}^2-\hat{r}_\perp^2\right)\)`

## Expectation value

The **expectation value** of an operator `\(\hat{X}\)` for a state `\(|\phi\rangle\)` with a given **local nuclear density** `\(\rho(\textbf{r})\)` is defined as

`$$
\boxed{
\langle \phi | \hat{X} | \phi \rangle \equiv \iiint \rho^*(\textbf{r}) X(\textbf{r}) \rho(\textbf{r}) d\textbf{r}^3.
}
$$`

## Observables

The expectation values of the previous geometrical operators are called **observables**:

* `\(\langle \phi | \hat{1} | \phi \rangle = \langle \phi | \phi \rangle\)`: **total number of particles** of the nuclear system.
* `\(\langle \phi | \hat{z} | \phi \rangle\)`: **`\(z\)`-position of the center of mass** of the nuclear system.
* `\(\langle \phi | \hat{r}_\perp | \phi \rangle\)`: **`\(r_\perp\)`-position of the center of mass** of the nuclear system.
* `\(\langle \phi | \hat{Q}_{20} | \phi \rangle\)`: **quadrupole moment** of the nuclear system.

# IPS-PROD - Observables 2/2

## Matrix representation

Let us take an orthonormal representation `\(\{|\psi_a\rangle\}\)`:

`$$
\boxed{
\forall (a, b), S_{ab} \equiv \langle \psi_a | \psi_b \rangle \equiv \langle \psi_a | \hat{1} | \psi_b \rangle = \iiint \psi^*(\textbf{r}) \psi(\textbf{r}) d\textbf{r}^3 = \delta_{ab}.
}
$$`
One can define the **matrix form** of an operator `\(\hat{X}\)` in the representation `\(\{|\psi_a\rangle\}\)` as
`$$
\forall (a, b), X_{ab} \equiv \langle \psi_a | \hat{X} | \psi_b \rangle.
$$`
If, for a state `\(|\phi\rangle\)` and its associated **density matrix** `\(\rho_{ab}\)`, one has
`$$
\boxed{
\rho(\textbf{r}) \equiv \sum_a \sum_b \rho_{ab} \psi_a(\textbf{r}) \psi_b^*(\textbf{r}),
}
$$`
then one has
`$$
\boxed{
\langle \phi | \hat{X} | \phi \rangle = \textrm{Tr}(X\rho) = \sum_{ab}X_{ab}\rho_{ba} = \sum_{ab}X_{ab}\rho_{ab}.
}
$$`

# IPS-PROD - POV-Ray `df3` writer

```C++
std::string cubeToDf3(const arma::cube &m)
{
  std::stringstream ss(std::stringstream::out | std::stringstream::binary);
  int nx = m.n_rows;
  int ny = m.n_cols;
  int nz = m.n_slices;
  ss.put(nx >> 8);
  ss.put(nx & 0xff);
  ss.put(ny >> 8);
  ss.put(ny & 0xff);
  ss.put(nz >> 8);
  ss.put(nz & 0xff);
  double theMin = 0.0;
  double theMax = m.max();
  for (uint k = 0; k < m.n_slices; k++)
  {
    for (uint j = 0; j < m.n_cols; j++)
    {
      for (uint i = 0; i < m.n_rows; i++)
      {
        uint v = 255 * (fabs(m(i, j, k)) - theMin) / (theMax - theMin);
        ss.put(v);
      }
    }
  }
  return ss.str();
}
```
where `m` is an `arma::cube` representing the density to be plotted.
**Mandatory dimensions for `m`**:

.hcenter[
| Axis |    x   |    y   |    z   |
| :--: | :----: | :----: | :----: |
| min  | -10 fm | -10 fm | -20 fm |
| max  |  10 fm |  10 fm |  20 fm |
| nbp  |  32    |  32    |  64    |
]

# IPS-PROD - Blender `raw` writer

```C++
std::string cubeToRaw(const arma::cube &m)
{
  std::stringstream ss(std::stringstream::out | std::stringstream::binary);
  double theMin = 0.0;
  double theMax = m.max();

  for (uint k = 0; k < m.n_slices; k++)
  {
    for (uint j = 0; j < m.n_cols; j++)
    {
      for (uint i = 0; i < m.n_rows; i++)
      {
        uint v = 255 * (fabs(m(i, j, k)) - theMin) / (theMax - theMin);
        ss.put(v);
      }
    }
  }

  return ss.str();
}
```
where `m` is an `arma::cube` representing the density to be plotted.
**Mandatory dimensions for `m`**:

.hcenter[
| Axis |    x   |    y   |    z   |
| :--: | :----: | :----: | :----: |
| min  | -10 fm | -10 fm | -20 fm |
| max  |  10 fm |  10 fm |  20 fm |
| nbp  |  32    |  32    |  64    |
]

# IPS-PROD - Density matrix values

The file containing the values of the `\(\rho\)` matrix can be found [here](files/rho.arma).
To read it, use the method `load()` of the `arma::mat` class:

```C++
arma::mat rho;
rho.load("rho.arma", arma::arma_ascii);
```

The corresponding basis has the following parameters:

```C++
//     br = 1.935801664793151, bz = 2.829683956491218, N = 14, Q = 1.3
Basis basis(1.935801664793151,      2.829683956491218,     14,     1.3);
```

:arrow_right: check that this basis contains 374 vectors !

The quantum numbers of the basis vector corresponding to the `\(i\)`-th row (or column) of the `\(\rho\)` matrix can be calculated with:

```C++
uint i = 0;
for (int m = 0; m < basis.mMax; m++)
for (int n = 0; n < basis.nMax(m); n++)
for (int n_z = 0; n_z < basis.n_zMax(m, n); n_z++)
{
  std::cout << "Basis vector " << i << ": m=" << m << " n=" << n << " n_z=" << n_z << std::endl;
  i++;
}
```
